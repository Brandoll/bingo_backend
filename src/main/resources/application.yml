spring:
  application:
    name: bsplay-backend
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/bsplay}
    username: ${DATABASE_USER:bsplay}
    password: ${DATABASE_PASSWORD:bsplay_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

springdoc:
  swagger-ui:
    path: /swagger-ui.html

bsplay:
  security:
    jwt-secret: ${JWT_SECRET:dev-only-change-this-secret-before-production-32chars}
    token-hours: ${JWT_TOKEN_HOURS:8}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  catalog:
    enabled: ${CATALOG_IMPORT_ENABLED:true}
